plugin:
  name: education
  wrapper: [education_model]
  logits_processors: [education_logits_processor, education_restricted_logits_processor] #education_logits_processor, education_restricted_logits_processor, default_logits_processor
  sequence_processor: [education_sequence_processor] #default_cumulative_sequence_processor #education_sequence_processor
  schema:
    module: schemas
    get:
      info: education_model.info
    post:
      recommend: run
      search: education_model.search

wrapper:
  pearlm: #kgglm: #pearlm
    name: education_model
    device: "cuda:0" # "cuda" or "cpu"
    recommendation_count: 5
    diversity_factor: 0.5
  
    load_col_item: ["course_id", "name"]

    # File recording one line per request, with what the user asked for and
    # what was returned. The path must live on a mounted volume, otherwise
    # the file disappears when the container is rebuilt.
    stats_path: "/app/stats/recstat.jsonl"
# ---------------------------------------------------------------------------
# Relation patterns
#
# Paths generated by the checkpoint contain two relations, so every pattern
# is a pair. Names are written without the suffix: the processors accept
# both the direct and the reverse form (_r), so the direction in which the
# model traverses the edge does not have to be guessed.
#
# taught_in_language and taught_in_level are left out on purpose: sharing a
# language or a difficulty level holds for a large share of the catalog and
# produces explanations with little informative content. Those two
# attributes act as filters instead.
# ---------------------------------------------------------------------------
 
logits_processors:
  education_logits_processor:
    name: education_logits_processor
    dataset: "/app/dataset"
    remove_user_tokens_from_sequences: false
 
    force_paths:
      - ['[UI-Relation]', '[UI-Relation]']
      - ['covers_in_concept', 'covers_in_concept']
      - ['belong_to_category', 'belong_to_category']
      - ['taught_by_instructor', 'taught_by_instructor']
      - ['has_target_audience', 'has_target_audience']
 
  education_restricted_logits_processor:
    name: education_restricted_logits_processor
    dataset: "/app/dataset"
 
    # When fewer allowed courses than min_reachable_courses can be reached
    # from the declared preferences, the filters are dropped for that
    # request and a note is left in the log. Set to 0 to disable the check.
    min_reachable_courses: 5
 
sequence_processor:
  education_sequence_processor:
    name: education_sequence_processor
 
    # Promoting one path per type rewrites the scores of the promoted
    # sequences, which stop being comparable with the others. Enable it for
    # demonstrations only, never for a measurement.
    diversify_by_path_type: false
 
    force_paths:
      - ['[UI-Relation]', '[UI-Relation]']
      - ['covers_in_concept', 'covers_in_concept']
      - ['belong_to_category', 'belong_to_category']
      - ['taught_by_instructor', 'taught_by_instructor']
      - ['has_target_audience', 'has_target_audience']